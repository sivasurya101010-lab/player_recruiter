{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayLink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">PlayLink</a>
        <div class="d-flex align-items-center gap-2">
            <span id="user-name" class="text-white small"></span>
            <button id="logout-btn" class="btn btn-outline-light btn-sm d-none">Logout</button>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div id="alert-box"></div>

    <section id="auth-section" class="auth-page">
        <div class="row g-0 auth-card shadow-lg">

            <div class="col-lg-7 auth-hero">
                <img
                    src="{% static 'images/login-hero.png' %}"
                    alt="PlayLink football community"
                    class="auth-hero-image"
                >
            </div>

            <div class="col-lg-5 auth-form-panel">

                <div id="login-panel">
                    <div class="auth-form-header">
                        <h2>Welcome Back</h2>
                        <p>Log in to your account</p>
                    </div>

                    <form id="login-form">
                        <label class="auth-input">
                            <span>✉</span>
                            <input id="login-username" placeholder="Username" required>
                        </label>

                        <label class="auth-input">
                            <span>🔒</span>
                            <input id="login-password" type="password" placeholder="Password" required>
                        </label>

                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <label class="remember-option">
                                <input type="checkbox" checked>
                                <span>Remember me</span>
                            </label>
                            <button type="button" class="forgot-button">Forgot password?</button>
                        </div>

                        <button class="btn auth-login-button w-100">
                            Log In <span>→</span>
                        </button>
                    </form>

                    <div class="auth-divider">
                        <span>OR</span>
                    </div>

                    <button type="button" class="google-button w-100">
                        <span class="google-icon">G</span>
                        Continue with Google
                    </button>

                    <p class="register-prompt">
                        New user?
                        <button type="button" id="show-register-btn" class="register-link">
                            Register
                        </button>
                    </p>
                </div>

                <div id="register-panel" class="d-none">
                    <div class="auth-form-header">
                        <h2>Create Account</h2>
                        <p>Join the PlayLink community</p>
                    </div>

                    <form id="register-form">
                        <label class="auth-input">
                            <span>👤</span>
                            <input id="register-username" placeholder="Username" required>
                        </label>

                        <label class="auth-input">
                            <span>✉</span>
                            <input id="register-email" type="email" placeholder="Email address" required>
                        </label>

                        <div class="row g-2">
                            <div class="col-6">
                                <label class="auth-input">
                                    <input id="register-first-name" placeholder="First name">
                                </label>
                            </div>
                            <div class="col-6">
                                <label class="auth-input">
                                    <input id="register-last-name" placeholder="Last name">
                                </label>
                            </div>
                        </div>

                        <label class="auth-input">
                            <span>🔒</span>
                            <input id="register-password" type="password" placeholder="Password" required>
                        </label>

                        <button class="btn auth-login-button w-100">
                            Create Account <span>→</span>
                        </button>
                    </form>

                    <p class="register-prompt">
                        Already have an account?
                        <button type="button" id="show-login-btn" class="register-link">
                            Log In
                        </button>
                    </p>
                </div>

            </div>
        </div>
    </section>

    <section id="app-section" class="d-none">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h2 class="mb-1">Find a game</h2>
                <p id="profile-summary" class="text-muted mb-0"></p>
            </div>
            <button id="refresh-btn" class="btn btn-outline-primary">Refresh</button>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="row g-2">
                    <div class="col-md-4">
                        <label class="form-label">Sport</label>
                        <select id="filter-sport" class="form-select">
                            <option value="">All sports</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Date</label>
                        <input id="filter-date" type="date" class="form-control">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Status</label>
                        <select id="filter-status" class="form-select">
                            <option value="">All</option>
                            <option value="OPEN">Open</option>
                            <option value="FULL">Full</option>
                            <option value="CANCELLED">Cancelled</option>
                            <option value="COMPLETED">Completed</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div id="games-list" class="row g-4 mb-5"></div>

        <div class="card shadow-sm">
            <div class="card-body">
                <h3>Create a game</h3>
                <form id="game-form">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Title</label>
                            <input id="game-title" class="form-control" placeholder="Sunday Football" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Sport</label>
                            <select id="game-sport" class="form-select" required></select>
                        </div>
                        <div id="custom-sport-wrap" class="col-md-6 d-none">
                            <label class="form-label">Custom sport</label>
                            <input id="custom-sport" class="form-control" placeholder="Volleyball">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Date</label>
                            <input id="game-date" type="date" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Start time</label>
                            <input id="game-time" type="time" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Duration (minutes)</label>
                            <input id="game-duration" type="number" min="1" value="90" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Players needed</label>
                            <input id="game-players" type="number" min="1" value="7" class="form-control" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Location</label>
                            <input id="game-location" class="form-control" placeholder="Ground / stadium" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Description</label>
                            <textarea id="game-description" class="form-control" rows="3" placeholder="Casual game..."></textarea>
                        </div>
                    </div>
                    <button class="btn btn-primary mt-3">Create game</button>
                </form>
            </div>
        </div>
    </section>
</main>

<div class="modal fade" id="players-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog"><div class="modal-content">
        <div class="modal-header"><h5 id="players-modal-title" class="modal-title">Game players</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body"><div id="players-list"></div></div>
    </div></div>
</div>

<div class="modal fade" id="edit-game-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg"><div class="modal-content">
        <form id="edit-game-form">
            <div class="modal-header"><h5 class="modal-title">Edit game</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <input type="hidden" id="edit-game-id">
                <div class="row g-3">
                    <div class="col-md-6"><label class="form-label">Title</label><input id="edit-game-title" class="form-control" required></div>
                    <div class="col-md-6"><label class="form-label">Sport</label><select id="edit-game-sport" class="form-select" required></select></div>
                    <div id="edit-custom-sport-wrap" class="col-md-6 d-none"><label class="form-label">Custom sport</label><input id="edit-custom-sport" class="form-control"></div>
                    <div class="col-md-6"><label class="form-label">Date</label><input id="edit-game-date" type="date" class="form-control" required></div>
                    <div class="col-md-4"><label class="form-label">Start time</label><input id="edit-game-time" type="time" class="form-control" required></div>
                    <div class="col-md-4"><label class="form-label">Duration</label><input id="edit-game-duration" type="number" min="1" class="form-control" required></div>
                    <div class="col-md-4"><label class="form-label">Players needed</label><input id="edit-game-players" type="number" min="1" class="form-control" required></div>
                    <div class="col-12"><label class="form-label">Location</label><input id="edit-game-location" class="form-control" required></div>
                    <div class="col-12"><label class="form-label">Description</label><textarea id="edit-game-description" class="form-control" rows="3"></textarea></div>
                </div>
            </div>
            <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button><button class="btn btn-primary">Save changes</button></div>
        </form>
    </div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'js/app.js' %}"></script>
</body>
</html>
